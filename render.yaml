services:
  - type: web
    name: no-me-olvido
    env: python
    region: oregon
    plan: free

    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py setup_inicial

    startCommand: gunicorn no_me_olvido.wsgi:application

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: no-me-olvido-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: "*"

      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com

      - key: DJANGO_ADMIN_USERNAME
        value: admin

      - key: DJANGO_ADMIN_PASSWORD
        value: hello23

databases:
  - name: no-me-olvido-db
    databaseName: no_me_olvido
    region: oregon
    plan: free
